name: Publish to npm

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish to npm
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Update npm to latest for OIDC support
        run: npm install -g npm@latest

      - name: Publish to npm (Trusted Publishing / OIDC)
        run: npm publish --access public

      - name: Pack for release asset
        run: npm pack --pack-destination .

      - name: Upload tgz to release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.tgz"